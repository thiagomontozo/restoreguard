name: CI
on:
  pull_request:
  push: {branches: [main]}
permissions: {contents: read}
concurrency: {group: "ci-${{ github.ref }}", cancel-in-progress: true}
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.x', cache-dependency-path: backend/go.sum}
      - name: Format
        run: test -z "$(gofmt -l backend)"
      - name: Vet and unit tests
        run: go vet ./... && go test -race -coverprofile=coverage.out ./...
        working-directory: backend
      - name: Build
        run: go build ./cmd/server
        working-directory: backend
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: backend-coverage, path: backend/coverage.out, if-no-files-found: ignore, retention-days: 7}
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6-alpine
        env: {POSTGRES_DB: restoreguard_test, POSTGRES_USER: restoreguard, POSTGRES_PASSWORD: restoreguard-test-only}
        ports: ['55433:5432']
        options: >-
          --health-cmd "pg_isready -U restoreguard -d restoreguard_test"
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      RESTOREGUARD_TEST_DATABASE_URL: postgres://restoreguard:restoreguard-test-only@127.0.0.1:55433/restoreguard_test?sslmode=disable
      RESTOREGUARD_TEST_S3_ENDPOINT: 127.0.0.1:59002
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.x', cache-dependency-path: backend/go.sum}
      - name: Start S3-compatible MinIO
        run: |
          docker run -d --name restoreguard-ci-minio \
            --label com.restoreguard.managed=true \
            --label com.restoreguard.purpose=integration \
            -p 59002:9000 \
            -e MINIO_ROOT_USER=restoreguardtest \
            -e MINIO_ROOT_PASSWORD=restoreguard-test-minio-only \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:59002/minio/health/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs restoreguard-ci-minio
          exit 1
      - name: PostgreSQL and object-storage integration
        run: go test -tags=integration -timeout 5m ./internal/database ./internal/storage -v
        working-directory: backend
      - name: Cleanup integration storage
        if: always()
        run: |
          if docker inspect restoreguard-ci-minio >/dev/null 2>&1; then
            docker rm -f -v restoreguard-ci-minio
          fi
  recovery-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.x', cache-dependency-path: backend/go.sum}
      - name: Synthetic PostgreSQL recovery E2E
        run: go test -tags=e2e -timeout 10m ./internal/drill -run 'TestPostgresRecoveryE2E|TestCorruptBackupFailsSafely|TestDockerSandboxExecutorLifecycle|TestCancellationPropagatesContext' -v
        working-directory: backend
      - name: Cleanup RestoreGuard Docker resources
        if: always()
        run: |
          docker ps -aq --filter label=com.restoreguard.managed=true | xargs --no-run-if-empty docker rm -f -v
          docker network ls -q --filter label=com.restoreguard.managed=true | xargs --no-run-if-empty docker network rm
          docker volume ls -q --filter label=com.restoreguard.managed=true | xargs --no-run-if-empty docker volume rm
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  frontend-e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start safe demo environment
        run: docker compose up -d --build --wait
      - name: Login, asset and recovery UI smoke
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:55173
          E2E_EMAIL: admin@restoreguard.local
          E2E_PASSWORD: restoreguard-demo-password
        run: npx playwright test e2e/smoke.spec.ts --reporter=line
        working-directory: frontend
      - name: Cleanup demo environment
        if: always()
        run: docker compose down -v --remove-orphans
  containers:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - run: docker build -f backend/Dockerfile -t restoreguard-backend:test .
      - run: docker build -f frontend/Dockerfile -t restoreguard-frontend:test .
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify OpenAPI contract
        run: |
          grep -q 'openapi: 3.1.0' contracts/openapi.yaml
          grep -q '/drills/{id}/events' contracts/openapi.yaml
