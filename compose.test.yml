name: restoreguard-test
services:
  postgres-test:
    image: postgres:17.6-alpine
    environment: {POSTGRES_DB: restoreguard_test, POSTGRES_USER: restoreguard, POSTGRES_PASSWORD: restoreguard-test-only}
    ports: ["127.0.0.1:55433:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U restoreguard -d restoreguard_test"], interval: 2s, timeout: 2s, retries: 30}
    labels: {com.restoreguard.managed: "true", com.restoreguard.purpose: "test"}
  minio-test:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data
    environment: {MINIO_ROOT_USER: restoreguardtest, MINIO_ROOT_PASSWORD: restoreguard-test-minio-only}
    ports: ["127.0.0.1:59002:9000"]
    tmpfs: ["/data"]
    healthcheck: {test: ["CMD", "mc", "ready", "local"], interval: 2s, timeout: 2s, retries: 30}
    labels: {com.restoreguard.managed: "true", com.restoreguard.purpose: "test"}
