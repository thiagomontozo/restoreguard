name: restoreguard
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: restoreguard
      POSTGRES_USER: restoreguard
      POSTGRES_PASSWORD: restoreguard-development-only
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["restoreguard-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restoreguard -d restoreguard"]
      interval: 5s
      timeout: 3s
      retries: 20
    labels: {com.restoreguard.managed: "true", com.restoreguard.purpose: "development"}
    networks: [control]
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: restoreguard
      MINIO_ROOT_PASSWORD: restoreguard-minio-development-only
    ports: ["127.0.0.1:59000:9000", "127.0.0.1:59001:9001"]
    volumes: ["restoreguard-minio:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    labels: {com.restoreguard.managed: "true", com.restoreguard.purpose: "development"}
    networks: [control]
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: {minio: {condition: service_healthy}}
    entrypoint: ["/bin/sh", "-c", "mc alias set local http://minio:9000 restoreguard restoreguard-minio-development-only && mc mb --ignore-existing local/restoreguard"]
    labels: {com.restoreguard.managed: "true", com.restoreguard.purpose: "development-init"}
    networks: [control]
  backend:
    image: restoreguard-backend:local
    build: {context: ., dockerfile: backend/Dockerfile}
    depends_on: {postgres: {condition: service_healthy}, minio-init: {condition: service_completed_successfully}}
    environment:
      RESTOREGUARD_ENV: development
      RESTOREGUARD_HTTP_ADDR: :8080
      RESTOREGUARD_DATABASE_URL: postgres://restoreguard:restoreguard-development-only@postgres:5432/restoreguard?sslmode=disable
      RESTOREGUARD_MIGRATION_PATH: /app/migrations
      RESTOREGUARD_SESSION_SECRET: local-development-session-secret-change-before-use
      RESTOREGUARD_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      RESTOREGUARD_OBJECT_STORAGE_TYPE: s3
      RESTOREGUARD_S3_ENDPOINT: minio:9000
      RESTOREGUARD_S3_BUCKET: restoreguard
      RESTOREGUARD_S3_ACCESS_KEY: restoreguard
      RESTOREGUARD_S3_SECRET_KEY: restoreguard-minio-development-only
      RESTOREGUARD_S3_USE_TLS: "false"
      RESTOREGUARD_ALLOWED_POSTGRES_IMAGE: postgres:17.6-alpine
      RESTOREGUARD_CORS_ORIGIN: http://localhost:55173
      RESTOREGUARD_BOOTSTRAP_ADMIN_EMAIL: admin@restoreguard.local
      RESTOREGUARD_BOOTSTRAP_ADMIN_PASSWORD: restoreguard-demo-password
    ports: ["127.0.0.1:58080:8080"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
    labels: {com.restoreguard.managed: "true", com.restoreguard.purpose: "development"}
    networks: [control]
  frontend:
    image: restoreguard-frontend:local
    build: {context: ., dockerfile: frontend/Dockerfile}
    depends_on: {backend: {condition: service_healthy}}
    ports: ["127.0.0.1:55173:8080"]
    labels: {com.restoreguard.managed: "true", com.restoreguard.purpose: "development"}
    networks: [control]
networks:
  control:
    labels: {com.restoreguard.managed: "true", com.restoreguard.purpose: "development"}
volumes:
  restoreguard-postgres: {labels: {com.restoreguard.managed: "true", com.restoreguard.purpose: "development"}}
  restoreguard-minio: {labels: {com.restoreguard.managed: "true", com.restoreguard.purpose: "development"}}
