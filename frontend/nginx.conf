server{listen 8080;server_name _;root /usr/share/nginx/html;index index.html;server_tokens off;add_header X-Content-Type-Options nosniff always;add_header Referrer-Policy no-referrer always;add_header X-Frame-Options DENY always;add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;location /api/{proxy_pass http://backend:8080;proxy_http_version 1.1;proxy_set_header Host $host;proxy_set_header X-Forwarded-Proto $scheme;proxy_buffering off;}location /health{proxy_pass http://backend:8080;}location /ready{proxy_pass http://backend:8080;}location /{try_files $uri $uri/ /index.html;}}
